<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#F3F4F8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; object-src 'none'; base-uri 'self'">
  <title>账号设置 · Memorize</title>
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/login.css?v=1">
</head>
<body>
  <main class="auth-card">
    <h1 class="auth-title">账号设置</h1>
    <p class="auth-sub" id="who">修改你的登录密码</p>
    <form id="pw-form" autocomplete="off">
      <label class="field">
        <span>当前密码</span>
        <input id="cur" type="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <label class="field">
        <span>新密码（≥8 位）</span>
        <input id="new" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
      </label>
      <label class="field">
        <span>确认新密码</span>
        <input id="confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
      </label>
      <button id="submit" type="submit">保 存</button>
      <p id="msg" class="error" role="alert"></p>
    </form>
    <p class="auth-sub" style="text-align:center;margin-top:18px"><a href="/" id="back">返回背单词</a></p>
  </main>
  <script src="/static/profile.js?v=1"></script>
</body>
</html>
