<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F3F4F8">
  <title>Memorize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=30">
</head>
<body>
  <div id="toast" class="hidden"></div>
  <div id="card-stage">
  <div id="card-prev" aria-hidden="true"></div>
  <div id="card">
    <div id="card-header">
      <span id="word-text"></span>
      <div id="word-meta">
        <span id="word-pos"></span>
        <span id="word-phonetic"></span>
        <button id="speak-btn" aria-label="朗读">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="answer-area">
      <div id="hint-area" class="hidden">
        <div id="hint-text">单击查看答案，3 秒后自动揭示</div>
      </div>
      <div id="definition" class="invisible"></div>
    </div>
    <div id="examples"></div>

    <div id="rating-row">
      <button class="rating-btn btn-again" data-rating="1">
        <span class="btn-label">忘 了</span>
        <span class="interval" id="int-again"></span>
      </button>
      <button class="rating-btn btn-hard" data-rating="2">
        <span class="btn-label">模 糊</span>
        <span class="interval" id="int-hard"></span>
      </button>
      <button class="rating-btn btn-good" data-rating="3">
        <span class="btn-label">记 得</span>
        <span class="interval" id="int-good"></span>
      </button>
      <button class="rating-btn btn-easy" data-rating="4">
        <span class="btn-label">轻 松</span>
        <span class="interval" id="int-easy"></span>
      </button>
    </div>

    <div id="stats-row">
      <span id="stat-stage"></span>
      <span id="stat-progress"></span>
      <span id="stat-counts"></span>
    </div>
  </div>

  </div><!-- #card-stage -->
  <script src="/static/app.js?v=30"></script>
</body>
</html>
